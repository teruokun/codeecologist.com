# Checks every pull request and branch push. No secrets, read-only token.
name: ci

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          # No dependency cache: a cache shared between runs is one more input
          # that could be poisoned. npm ci is fast for this lockfile.
          package-manager-cache: false
      - run: npm ci
      # Type check, build, then fail on any TODO(jeff) shown in dist/.
      - run: npm run check
      - run: npm test
      - name: SBOM (smoke test)
        run: npm sbom --sbom-format=cyclonedx --sbom-type=application > /dev/null
      - name: Checksums (smoke test)
        run: scripts/checksums.sh
      - name: Deploy tools install from their lockfile
        working-directory: deploy
        run: npm ci

  infra:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      TOFU_VERSION: 1.13.9
      # From tofu_1.13.9_SHA256SUMS on the OpenTofu release page.
      TOFU_SHA256: b34b327cc1ef07178207b6f2cd1f5276537d3e5b7be316500f6dac50d4c0a857
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install OpenTofu (checksum-pinned)
        run: |
          archive="tofu_${TOFU_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/opentofu/opentofu/releases/download/v${TOFU_VERSION}/${archive}"
          echo "${TOFU_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/tofu"
          tar -xzf "$archive" -C "$RUNNER_TEMP/tofu" tofu
          echo "$RUNNER_TEMP/tofu" >> "$GITHUB_PATH"
      - name: Format
        working-directory: infra
        run: tofu fmt -check -recursive
      - name: Validate (no credentials, no backend)
        working-directory: infra
        run: |
          tofu init -backend=false -lockfile=readonly -input=false
          tofu validate
